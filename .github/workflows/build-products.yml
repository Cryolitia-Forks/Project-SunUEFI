name: Build products

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-products.yml'
      - '.gitmodules'
      - 'build.sh'
      - 'Makefile'
      - 'requirements-build.txt'
      - 'sources.lock.json'
      - 'containers/**'
      - 'config/**'
      - 'patches/firmware/**'
      - 'uefi/**'
      - 'vendor/piano/**'
      - 'android/**'
      - 'linux/kernel-profiles.json'
      - 'tools/**'
      - 'upstream/Mu-Silicium'
      - 'upstream/simple-init'
      - 'upstream/linux-piano'
      - 'upstream/dtc'
      - 'upstream/piano-firmware-current'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-module-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      SUNUEFI_BUILD_TARGET: uefi
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: false
          persist-credentials: false
      - name: Get required fixed sources
        run: |
          set -o pipefail
          mkdir -p build/logs
          ./build.sh sources 2>&1 | tee build/logs/sources.log
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: build/ccache
          key: ccache-${{ runner.arch }}-uefi-${{ hashFiles('sources.lock.json', 'patches/firmware/**', 'config/**') }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.arch }}-uefi-${{ hashFiles('sources.lock.json', 'patches/firmware/**', 'config/**') }}-
      - name: Build the pinned-base environment
        run: |
          set -o pipefail
          python3 tools/build_container.py 2>&1 | tee build/logs/container.log
      - name: Build UEFI and Android module
        run: |
          set -o pipefail
          mkdir -p build/ccache artifacts/android
          docker run --rm \
            -v "$PWD:/workspace" -w /workspace \
            -e CCACHE_DIR=/workspace/build/ccache -e CCACHE_MAXSIZE=3G \
            -e SUNUEFI_BUILD_TARGET sunuefi-builder bash -euc '
              git config --global --add safe.directory /workspace
              git config --global --add safe.directory "/workspace/*"
              python3 -m venv .venv
              .venv/bin/pip install -r requirements-build.txt
              . .venv/bin/activate
              ./build.sh uefi
              ./build.sh module
            ' 2>&1 | tee build/logs/ci-build.log
      - name: Show failed build output
        if: failure()
        run: |
          if [ -f build/logs/ci-build.log ]; then
            tail -n 160 build/logs/ci-build.log
          fi
      - name: Verify Android module download
        run: |
          cd artifacts/android
          sha256sum -c SHA256SUMS
      - name: Android assistant module
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: SunUEFI-Module
          path: |
            artifacts/android/SunUEFI-Piano-*.zip
            artifacts/android/SHA256SUMS
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: Build logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: logs
          path: |
            build/logs/
            sources.lock.json
            config/piano-product.json
            patches/firmware/series.json
            artifacts/product/manifest.json
            artifacts/android/manifest.json
            build/android-product-module/manifest.json
            build/android-product-module/sysroot-source.json
            build/android-product-module/e2fs-tools/build.log
            artifacts/simpleinit/product/source-manifest.json
            artifacts/simpleinit/product/build-ok.json
          if-no-files-found: warn
          retention-days: 7
          compression-level: 6
